name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:cov

      - name: Build bundle
        run: npm run build

      - name: Verify dist/ is up to date
        run: git diff --exit-code dist/

  dogfood:
    name: Self-test InfraGuard Action (Free)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: verify
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run InfraGuard local action
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment: 'true'
