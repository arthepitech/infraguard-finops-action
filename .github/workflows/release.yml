name: Release Major Tag

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  update-major-tag:
    name: Update floating major tag (e.g. v1)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push major tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR_TAG="${TAG%%.*}"
          echo "Updating floating tag ${MAJOR_TAG} -> ${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${MAJOR_TAG}" "${TAG}"
          git push -f origin "${MAJOR_TAG}"
